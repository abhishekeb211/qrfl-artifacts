version: "3.8"

services:
  qrfl-pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../results:/app/results
    working_dir: /app

  # Dedicated slim RAPL / Exp F image (not the full pipeline stack).
  # Numeric mJ needs host intel-rapl; on Docker Desktop expect NO_RAPL / ---.
  rapl-profile:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rapl
    image: abhi211b/qrfl-rapl:latest
    privileged: true
    environment:
      QRFL_RAPL_IMAGE: abhi211b/qrfl-rapl:latest
    volumes:
      - ../results:/app/results
      - ../configs:/app/configs:ro
    working_dir: /app
    # Override with: docker compose run rapl-profile probe
    command: ["profile"]
