# QRFL Fabric channel configuration (Fabric 2.5)
Organizations:
  - &OrdererOrg
    Name: OrdererMSP
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &HospitalA
    Name: HospitalAMSP
    ID: HospitalAMSP
    MSPDir: crypto-config/peerOrganizations/hospitala.example.com/msp
    AnchorPeers:
      - Host: peer0.hospitala.example.com
        Port: 7051
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('HospitalAMSP.admin', 'HospitalAMSP.peer', 'HospitalAMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('HospitalAMSP.admin', 'HospitalAMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('HospitalAMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('HospitalAMSP.peer')"

  - &HospitalB
    Name: HospitalBMSP
    ID: HospitalBMSP
    MSPDir: crypto-config/peerOrganizations/hospitalb.example.com/msp
    AnchorPeers:
      - Host: peer0.hospitalb.example.com
        Port: 9051
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('HospitalBMSP.admin', 'HospitalBMSP.peer', 'HospitalBMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('HospitalBMSP.admin', 'HospitalBMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('HospitalBMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('HospitalBMSP.peer')"

  - &Research
    Name: ResearchMSP
    ID: ResearchMSP
    MSPDir: crypto-config/peerOrganizations/research.example.com/msp
    AnchorPeers:
      - Host: peer0.research.example.com
        Port: 10051
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ResearchMSP.admin', 'ResearchMSP.peer', 'ResearchMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('ResearchMSP.admin', 'ResearchMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('ResearchMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('ResearchMSP.peer')"

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: solo
  Addresses:
    - orderer.example.com:7050
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  OrdererGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities:
        <<: *OrdererCapabilities
    Consortiums:
      QRFLConsortium:
        Organizations:
          - *HospitalA
          - *HospitalB
          - *Research
    Application:
      <<: *ApplicationDefaults
      Organizations:

  QRFL:
    Consortium: QRFLConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *HospitalA
        - *HospitalB
        - *Research
      Capabilities:
        <<: *ApplicationCapabilities
